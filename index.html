<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Drift Circuit v0.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#86c7ef;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}canvas{display:block}#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;color:white;text-shadow:0 2px 5px #0009;pointer-events:none}#speed{font-size:32px;font-weight:900}#speed small{font-size:13px}#meter{width:180px;height:12px;border:2px solid #fff9;border-radius:8px;background:#0006;overflow:hidden}#fill{height:100%;width:0%;background:linear-gradient(90deg,#35bfff,#ffe45c)}#hint{font-size:12px;margin-top:7px}#controls{position:fixed;inset:0;pointer-events:none}.pad{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}.left{left:18px}.right{right:18px;align-items:end}.btn{border:2px solid #ffffffb0;border-radius:20px;background:#101e39a8;color:white;font-weight:900;font-size:18px;width:72px;height:72px;touch-action:none;-webkit-tap-highlight-color:transparent}.btn:active,.btn.down{background:#33a5eddd;transform:scale(.96)}.wide{width:82px}.boost{background:#dd8725bb}.drift{background:#8a4fc3bd}#reset{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));padding:10px;border-radius:12px;border:1px solid #fff8;background:#0008;color:white}#msg{position:fixed;top:19%;width:100%;text-align:center;color:white;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none;font-size:18px}@media(max-width:650px){.btn{width:57px;height:62px;font-size:14px;border-radius:15px}.wide{width:63px}.pad{gap:7px}.left{left:9px}.right{right:9px}#hint{font-size:10px}}
</style></head><body><div id="hud"><div id="speed">0 <small>km/h</small></div><div>BOOST <span id="boostText">0%</span></div><div id="meter"><div id="fill"></div></div><div id="hint">드리프트로 부스터 충전 · 벽 충돌 시 감속</div></div><button id="reset">↻ 리셋</button><div id="msg">DRIFT CIRCUIT · v0.1</div><div id="controls"><div class="pad left"><button class="btn" data-key="left">◀</button><button class="btn" data-key="right">▶</button></div><div class="pad right"><button class="btn drift" data-key="drift">DRIFT</button><button class="btn boost" data-key="boost">BOOST</button><button class="btn" data-key="brake">BRAKE</button><button class="btn wide" data-key="gas">GO</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x86c7ef);scene.fog=new THREE.Fog(0x86c7ef,140,350);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x5b8463,2.1));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(35,65,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.85});const grass=mat(0x66b45f),road=mat(0x343b49),wall=mat(0xe8e8ec),yellow=mat(0xffd74e),blue=mat(0x258fff);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// Elliptical loop, with smooth road, shoulder stripes, and collision boundaries.
const A=76,B=48,half=10,N=240;const curve=(t,r=0)=>{let x=A*Math.cos(t),z=B*Math.sin(t);const nx=Math.cos(t)/A,nz=Math.sin(t)/B,len=Math.hypot(nx,nz);return new THREE.Vector3(x+r*nx/len,.06,z+r*nz/len)};
function ribbon(r1,r2,material,y=.05){const vertices=[],indices=[];for(let i=0;i<=N;i++){let t=i/N*Math.PI*2;for(const r of [r1,r2]){let p=curve(t,r);vertices.push(p.x,y,p.z)}}for(let i=0;i<N;i++){let j=i*2;indices.push(j,j+1,j+2,j+1,j+3,j+2)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setIndex(indices);g.computeVertexNormals();const m=new THREE.Mesh(g,material);m.receiveShadow=true;scene.add(m)}
ribbon(-half,half,road);ribbon(-half,-half+.45,yellow,.075);ribbon(half-.45,half,yellow,.075);
for(let i=0;i<80;i++){const t=i/80*Math.PI*2;const p=curve(t,0);const q=curve(t+.012,0);const stripe=new THREE.Mesh(new THREE.BoxGeometry(.28,.035,2.6),wall);stripe.position.copy(p);stripe.position.y=.11;stripe.rotation.y=Math.atan2(q.x-p.x,q.z-p.z);scene.add(stripe)}
for(const r of [-half-1,half+1])for(let i=0;i<N;i++){let p=curve((i+.5)/N*Math.PI*2,r),q=curve((i+1.5)/N*Math.PI*2,r);const segment=new THREE.Mesh(new THREE.BoxGeometry(.6,1.25,p.distanceTo(q)+.3),i%12<6?wall:blue);segment.position.copy(p);segment.position.y=.65;segment.rotation.y=Math.atan2(q.x-p.x,q.z-p.z);scene.add(segment)}
const kart=new THREE.Group();const chassis=new THREE.Mesh(new THREE.BoxGeometry(2.4,.65,3.6),mat(0xf44336));chassis.position.y=.78;chassis.castShadow=true;kart.add(chassis);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.8,.4,1.1),mat(0xff8b42));hood.position.set(0,1.15,1);kart.add(hood);const seat=new THREE.Mesh(new THREE.BoxGeometry(1.5,.7,1.15),mat(0x23344b));seat.position.set(0,1.35,-.6);kart.add(seat);for(const x of [-1.25,1.25])for(const z of [-1.15,1.15]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.36,16),mat(0x161b24));w.rotation.z=Math.PI/2;w.position.set(x,.53,z);kart.add(w)}scene.add(kart);
const state={x:A,z:0,angle:0,v:0,slide:0,boost:0,boostTime:0};const keys={left:false,right:false,gas:false,brake:false,drift:false,boost:false};const buttons=document.querySelectorAll('[data-key]');for(const btn of buttons){const key=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);keys[key]=true;btn.classList.add('down')});for(const event of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(event,()=>{keys[key]=false;btn.classList.remove('down')})}const mappings={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',' ':'drift',Shift:'boost'};window.addEventListener('keydown',e=>{if(mappings[e.key]){keys[mappings[e.key]]=true;e.preventDefault()}});window.addEventListener('keyup',e=>{if(mappings[e.key])keys[mappings[e.key]]=false});
function reset(){Object.assign(state,{x:A,z:0,angle:0,v:0,slide:0,boost:0,boostTime:0})}document.querySelector('#reset').onclick=reset;
let last=performance.now();const cameraTarget=new THREE.Vector3();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.04);last=now;const s=state;const turn=(keys.right?1:0)-(keys.left?1:0);const drifting=keys.drift&&Math.abs(turn)>0&&Math.abs(s.v)>6;
if(keys.boost&&s.boost>=100&&s.boostTime<=0){s.boost=0;s.boostTime=2.2}if(s.boostTime>0)s.boostTime=Math.max(0,s.boostTime-dt);
const maxSpeed=s.boostTime>0?53:37;const acceleration=keys.gas?(s.boostTime>0?30:19):0;const braking=keys.brake?31:0;s.v+=((keys.gas?acceleration:0)-(keys.brake?braking:0)-s.v*(keys.gas?.095:.6))*dt;s.v=THREE.MathUtils.clamp(s.v,-10,maxSpeed);if(Math.abs(s.v)<.05&&!keys.gas)s.v=0;
const steer=turn*(drifting?1.95:1.35)*Math.min(1,Math.abs(s.v)/12)*dt*Math.sign(s.v||1);s.angle+=steer;const targetSlide=drifting?turn*.55:0;s.slide=THREE.MathUtils.damp(s.slide,targetSlide,drifting?4:5,dt);const travelAngle=s.angle-s.slide;s.x+=Math.sin(travelAngle)*s.v*dt;s.z+=Math.cos(travelAngle)*s.v*dt;if(drifting){s.v=Math.max(0,s.v-3*dt);s.boost=Math.min(100,s.boost+dt*(8+Math.abs(s.v)*.37))}
// Nearest ellipse-centerline approximation via angular parameter.
const t=Math.atan2(s.z/B,s.x/A);const p=curve(t);const dist=Math.hypot(s.x-p.x,s.z-p.z);if(dist>half-1.4){s.v*=Math.max(0,1-3*dt);if(dist>half+.5){const ratio=(half+.5)/dist;s.x=p.x+(s.x-p.x)*ratio;s.z=p.z+(s.z-p.z)*ratio}}
kart.position.set(s.x,.08,s.z);kart.rotation.y=s.angle;const behind=new THREE.Vector3(s.x-Math.sin(s.angle)*10,6.2,s.z-Math.cos(s.angle)*10);camera.position.lerp(behind,1-Math.exp(-5*dt));cameraTarget.set(s.x,1.25,s.z);camera.lookAt(cameraTarget);document.querySelector('#speed').innerHTML=Math.round(Math.abs(s.v)*5.1)+' <small>km/h</small>';document.querySelector('#boostText').textContent=Math.floor(s.boost)+'%';document.querySelector('#fill').style.width=s.boost+'%';renderer.render(scene,camera)}requestAnimationFrame(frame);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#msg').style.display='none',2800);
</script></body></html>
